<!doctype html>

    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />

      The dashboard paints its own background, so the browser chrome is told
      which one to match instead of guessing white and flashing on load.

    <meta name="theme-color" content="#070d16" media="(prefers-color-scheme: dark)" />
    <meta
      name="description"
      content="Health Insight Dashboard — a personal health and wellness overview with an AI assistant grounded in your own data."
    />
    <title>Health Insight Dashboard</title>
  </head>
